name: Release

on:
  push:
    # Accept both conventions — `v0.4.0` and bare `0.4.0` (this repo's existing tags).
    tags: ["v*", "[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: the released dist/ must byte-match the committed one (checked below).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check (prettier + eslint + build + icon guard + parse)
        run: bun run check

      - name: dist/ is in sync with src/
        run: git diff --exit-code dist/fibbers.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fibbers.js
          generate_release_notes: true
