name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: the committed dist/ is byte-compared against a fresh build below,
      # so CI must bundle with the same bun the artifact was built with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Regenerate icons
        run: bun run gen-icons

      - name: Check (prettier + eslint + build + icon guard + parse)
        run: bun run check

      - name: dist/ and generated files are in sync with src/
        run: git diff --exit-code dist/fibbers.js dist/icons.full.json src/generated/icons.core.gen.js src/generated/tailwind.gen.js

      - name: Both release assets exist
        run: test -f dist/fibbers.js && test -f dist/icons.full.json

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the stories import the built bundle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Storybook
        working-directory: storybook
        run: |
          npm ci
          npm run build-storybook

      - name: Install Playwright chromium
        working-directory: storybook
        run: npx playwright install chromium --with-deps

      # Every story is a smoke test + an axe pass (critical/serious fail) —
      # see storybook/.storybook/test-runner.js.
      - name: Story smoke + a11y tests
        working-directory: storybook
        run: npm run test-storybook:static
