name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Regenerate icons
        run: bun run gen-icons

      - name: Check (prettier + eslint + build + icon guard + parse)
        run: bun run check

      - name: dist/ and generated files are in sync with src/
        run: git diff --exit-code dist/fibbers.js src/icons.gen.js src/tailwind.gen.js

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the stories import the built bundle
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Storybook
        working-directory: storybook
        run: |
          npm ci
          npm run build-storybook
