<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fibbers — preview harness</title>

    <!--
      Fibbers preview harness — Phase 0.

      Standalone. No build, no network, no Home Assistant. It loads the real
      ../dist/fibbers.js against a stubbed `hass` so every card can be seen and
      iterated on without an HA instance. Open it directly in a browser
      (file://) — nothing here fetches anything.

      Layout: every card is rendered twice — once in a 390px phone column, once
      in a 1200px desktop grid — so responsive behaviour is visible at a glance.

      Note on the nav bar: fibbers-nav renders a SINGLETON bottom bar into
      document.body and reference-counts its owners. Placing two nav instances
      (phone + desktop) therefore shows ONE shared bar pinned to the window,
      each column reserving space via its own spacer. That is by design — it
      demonstrates the dedup, not a bug.

      Caveat: tab / back buttons call navigate() -> history.pushState to a real
      path. On a file:// origin that can throw, so clicking them here is inert
      or noisy. Automated verification never clicks them; it only loads the
      page and flips the state toggles below (which just reassign `hass`).
    -->

    <style>
      :root {
        --fib-bg: #111516;
        --fib-card: #1d2426;
        --fib-card-2: #262f31;
        --fib-line: #333e41;
        --fib-ink: #edf1f1;
        --fib-ink-2: #a9b6b9;
        --fib-muted: #7d8b8e;
        --fib-amber: #e8a33d;
        --fib-accent: #74b98a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--fib-bg);
        color: var(--fib-ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 18px 20px 10px;
        border-bottom: 1px solid var(--fib-line);
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: var(--fib-muted);
      }

      /* State toggles — everything Phase 0 needs to check lit vs offline etc. */
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--fib-line);
        background: #141a1b;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--fib-ink-2);
        background: var(--fib-card);
        border: 1px solid var(--fib-line);
        border-radius: 999px;
        padding: 5px 11px 5px 8px;
        cursor: pointer;
        user-select: none;
      }
      .controls input {
        accent-color: var(--fib-accent);
      }

      /* Two columns: phone and desktop. */
      .stage {
        display: flex;
        gap: 28px;
        align-items: flex-start;
        padding: 22px 20px 40px;
        overflow-x: auto;
      }
      .col-title {
        font:
          500 9.5px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--fib-muted);
        margin: 0 0 10px 2px;
      }

      .phone {
        flex: 0 0 auto;
        width: 390px;
        background: var(--fib-bg);
        border: 1px solid var(--fib-line);
        border-radius: 22px;
        padding: 14px;
        min-height: 520px;
      }
      .desktop {
        flex: 0 0 auto;
        width: 1200px;
      }
      .desktop .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        background: var(--fib-bg);
        border: 1px solid var(--fib-line);
        border-radius: 18px;
        padding: 16px;
        min-height: 200px;
      }

      /* Each card specimen gets a small caption so it is identifiable. */
      .specimen {
        margin-bottom: 14px;
      }
      .specimen > .cap {
        font:
          500 9px/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: var(--fib-muted);
        margin: 0 0 6px 2px;
      }

      /* On-page mirror of hass.callService, next to the console. */
      #svclog {
        position: fixed;
        right: 12px;
        bottom: 92px;
        width: 280px;
        max-height: 40vh;
        overflow: auto;
        background: rgba(20, 26, 27, 0.94);
        border: 1px solid var(--fib-line);
        border-radius: 10px;
        padding: 8px 10px;
        font:
          10.5px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: var(--fib-ink-2);
        z-index: 4;
      }
      #svclog b {
        display: block;
        color: var(--fib-muted);
        font-weight: 500;
        margin-bottom: 4px;
      }
      #svclog .empty {
        color: var(--fib-muted);
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Fibbers — preview harness</h1>
      <p>
        Standalone. Loads dist/fibbers.js against a stubbed hass. No HA, no
        network.
      </p>
    </header>

    <div class="controls" id="controls"></div>
    <div class="stage" id="stage"></div>

    <aside id="svclog">
      <b>hass.callService</b><span class="empty">— no calls yet —</span>
    </aside>

    <!--
      1) STUBS — defined BEFORE fibbers.js loads.
         `ha-icon` is provided by HA at runtime and does not exist in a bare
         page, so the cards' icons would be blank (and the console would warn)
         without this. We render a glyph sized to the element's box.
    -->
    <script>
      (function () {
        const GLYPHS = {
          "solar:home-2-bold-duotone": "⌂",
          "solar:lightbulb-bolt-bold-duotone": "☀",
          "solar:lightbulb-bold-duotone": "○",
          "solar:music-note-bold-duotone": "♪",
          "mdi:speaker": "◈",
          "solar:tv-bold-duotone": "▭",
          "solar:menu-dots-bold-duotone": "⋯",
          "solar:alt-arrow-left-bold-duotone": "‹",
          "mdi:chevron-right": "›",
          "mdi:circle-small": "•",
          "mdi:alert": "⚠",
          "mdi:check": "✓",
          "mdi:check-circle": "✓",
          "solar:sofa-2-bold-duotone": "🛋",
          "solar:bed-bold-duotone": "🛏",
          "solar:alarm-bold-duotone": "⏰",
          "solar:power-bold-duotone": "⏻",
          "solar:moon-bold-duotone": "☾",
          "solar:sun-bold-duotone": "☀",
          "solar:clapperboard-play-bold-duotone": "🎬",
          "mdi:palette": "🎨",
          "solar:home-angle-bold-duotone": "⌂",
        };
        class HaIconStub extends HTMLElement {
          static get observedAttributes() {
            return ["icon"];
          }
          connectedCallback() {
            this._render();
          }
          attributeChangedCallback() {
            this._render();
          }
          _render() {
            const name = this.getAttribute("icon") || "";
            this.textContent = GLYPHS[name] || "●";
            this.style.display = "inline-flex";
            this.style.alignItems = "center";
            this.style.justifyContent = "center";
            this.style.lineHeight = "1";
            this.style.overflow = "visible";
            // size the glyph to the box the card CSS gave us
            requestAnimationFrame(() => {
              const w = this.clientWidth || 16;
              this.style.fontSize = Math.round(w * 0.92) + "px";
            });
          }
        }
        if (!customElements.get("ha-icon"))
          customElements.define("ha-icon", HaIconStub);

        // Sheet child cards go through this. Create real fibbers-* elements so
        // sheets show live content; fall back to a placeholder for other types.
        window.loadCardHelpers =
          window.loadCardHelpers ||
          (async () => ({
            createCardElement: (cfg) => {
              const type = (cfg && cfg.type) || "";
              const tag = type.replace(/^custom:/, "");
              if (tag.startsWith("fibbers-") && customElements.get(tag)) {
                const el = document.createElement(tag);
                try {
                  el.setConfig(cfg);
                } catch (e) {
                  el.textContent = "config error: " + e.message;
                }
                return el;
              }
              const el = document.createElement("div");
              el.style.cssText =
                "color:#7d8b8e;font:12px ui-monospace,Menlo,monospace;padding:8px";
              el.textContent = "[stub card: " + type + "]";
              return el;
            },
          }));
      })();
    </script>

    <!-- 2) The real plugin. -->
    <script src="../dist/fibbers.js"></script>

    <!-- 3) HARNESS — fake hass, toggles, and the two-column layout. -->
    <script>
      // IIFE so none of these names collide with fibbers.js's top-level consts
      // (both are classic scripts sharing one global lexical scope).
      (function () {
        const NOW = new Date().toISOString();

        // Toggle state that matters for lit / offline / battery / update styling.
        const flags = {
          tvLed: true, // light.tv_led_strip on/off
          hueGo: false, // light.hue_go_1 available (true) / unavailable (false)
          battLow: false, // hue motion battery low/high
          update: true, // an update pending / none
        };

        function buildStates() {
          const S = {};
          const add = (id, state, attributes = {}) => {
            S[id] = {
              entity_id: id,
              state,
              attributes,
              last_changed: NOW,
              last_updated: NOW,
            };
          };

          // --- lights (the 6 real bulbs + the group) ---
          add("light.tv_led_strip", flags.tvLed ? "on" : "off", {
            friendly_name: "TV LED",
            brightness: flags.tvLed ? 204 : 0,
            color_mode: flags.tvLed ? "hs" : null,
            supported_color_modes: ["hs", "color_temp"],
          });
          add("light.kitchen", "on", {
            friendly_name: "Gitaarlamp",
            brightness: 178,
          });
          add("light.woonkamer_computer", "off", { friendly_name: "Computer" });
          add("light.kitchen_lsc_led_strip", "on", {
            friendly_name: "Keuken LED",
            brightness: 120,
          });
          add("light.hue_go_1", flags.hueGo ? "off" : "unavailable", {
            friendly_name: "Slaapkamerlamp",
          });
          add(
            "light.hue_lightstrip_plus_1",
            flags.hueGo ? "off" : "unavailable",
            {
              friendly_name: "Bedroom LED",
            },
          );
          add("light.all_color_lights", flags.tvLed ? "on" : "off", {
            friendly_name: "Alle lampen",
            entity_id: [
              "light.tv_led_strip",
              "light.kitchen",
              "light.woonkamer_computer",
              "light.kitchen_lsc_led_strip",
              "light.hue_go_1",
              "light.hue_lightstrip_plus_1",
            ],
          });

          // --- media players ---
          add("media_player.eetkamer", "playing", {
            friendly_name: "Woonkamer",
            media_title: "NPO Radio 2",
            volume_level: 0.34,
          });
          add("media_player.43pus7608_12", "off", {
            friendly_name: "Philips TV",
          });
          add("media_player.living_room", "idle", {
            friendly_name: "Apple TV",
          });

          // --- sensors ---
          add("sensor.hue_motion_sensor_1_temperature", "21.4", {
            friendly_name: "Temperatuur woonkamer",
            unit_of_measurement: "°C",
            device_class: "temperature",
          });
          add("sensor.hue_motion_sensor_1_illuminance", "64", {
            friendly_name: "Lichtsterkte woonkamer",
            unit_of_measurement: "lx",
            device_class: "illuminance",
          });
          add(
            "sensor.hue_motion_sensor_1_battery",
            flags.battLow ? "8" : "92",
            {
              friendly_name: "Batterij bewegingssensor",
              unit_of_measurement: "%",
              device_class: "battery",
            },
          );
          add("binary_sensor.hue_motion_sensor_1_motion", "off", {
            friendly_name: "Beweging woonkamer",
            device_class: "motion",
          });

          // --- people ---
          add("person.elian", "home", { friendly_name: "Elian" });
          add("person.chelsae", "not_home", { friendly_name: "Chelsae" });

          // --- helpers ---
          add("input_boolean.wake_alarm_enabled", "on", {
            friendly_name: "Wekker ingeschakeld",
          });
          add("input_datetime.wake_up_time", "07:00:00", {
            friendly_name: "Wektijd",
            has_time: true,
            has_date: false,
          });
          add("input_datetime.wake_fade_start", "06:45:00", {
            friendly_name: "Wekker fade-start",
            has_time: true,
            has_date: false,
          });
          add("input_select.radio_nu", "NPO Radio 2", {
            friendly_name: "Radiostation",
            options: ["NPO Radio 2", "3FM", "Sky Radio", "Qmusic", "538"],
          });

          // --- fabricated update entity ---
          // CLAUDE.md's house list has no update.* entity, but the Phase 0
          // "update pending/none" toggle and Phase 4's alert card need one. Swap
          // this for a real update entity id when the alert card lands.
          add("update.home_assistant_core", flags.update ? "on" : "off", {
            friendly_name: "Home Assistant Core update",
            device_class: "update",
            installed_version: "2024.11.0",
            latest_version: flags.update ? "2024.12.1" : "2024.11.0",
            title: "Home Assistant Core",
          });

          // --- scenes (Avond most recently activated) ---
          add("scene.avond", "2026-08-31T19:12:00+00:00", {
            friendly_name: "Avond",
          });
          add("scene.helder", "2026-08-31T08:03:00+00:00", {
            friendly_name: "Helder",
          });
          add("scene.film", "2026-08-30T21:40:00+00:00", {
            friendly_name: "Film",
          });

          return S;
        }

        function mirror(line) {
          const box = document.getElementById("svclog");
          const empty = box.querySelector(".empty");
          if (empty) empty.remove();
          const row = document.createElement("div");
          row.textContent = line;
          box.appendChild(row);
          box.scrollTop = box.scrollHeight;
        }

        function buildHass() {
          return {
            states: buildStates(),
            language: "nl",
            themes: { darkMode: true },
            user: { name: "Elian", is_admin: true },
            localize: (k) => k,
            callWS: async () => ({}),
            callService(domain, service, data) {
              console.log("[callService]", domain + "." + service, data || {});
              mirror(domain + "." + service + " " + JSON.stringify(data || {}));
            },
          };
        }

        // --- card specimens: add one line per new card in later phases ---
        const NAV_CONFIG = {
          type: "custom:fibbers-nav",
          auto_hide: false,
          tabs: [
            {
              name: "Huis",
              icon: "solar:home-2-bold-duotone",
              path: "/dashboard-thuis/huis",
            },
            {
              name: "Licht",
              icon: "solar:lightbulb-bolt-bold-duotone",
              path: "/dashboard-thuis/licht",
            },
            {
              name: "Muziek",
              icon: "solar:music-note-bold-duotone",
              path: "/dashboard-thuis/muziek",
            },
            {
              name: "TV",
              icon: "solar:tv-bold-duotone",
              path: "/dashboard-thuis/tv",
            },
            {
              name: "Meer",
              icon: "solar:menu-dots-bold-duotone",
              path: "/dashboard-thuis/meer",
              // dot appears when the update toggle is on
              badge: { entity: "update.home_assistant_core", when: "on" },
            },
          ],
        };
        const BACK_CONFIG = {
          type: "custom:fibbers-back",
          fallback: "/dashboard-thuis/huis",
          labels: {
            "/dashboard-thuis/huis": "Huis",
            "/dashboard-thuis/licht": "Licht",
          },
        };

        const SECTION_CONFIG = {
          type: "custom:fibbers-section",
          label: "Kamers",
        };
        const SHEET_CONFIG = {
          type: "custom:fibbers-sheet",
          id: "demo-sheet",
          title: "Woonkamer",
          icon: "solar:sofa-2-bold-duotone",
          subtitle: "3 lampen · 21,4 °C",
          cards: [
            { type: "custom:fibbers-section", label: "Verlichting" },
            { type: "custom:fibbers-light-row", entity: "light.tv_led_strip" },
            { type: "custom:fibbers-light-row", entity: "light.kitchen" },
            { type: "custom:fibbers-light-row", entity: "light.hue_go_1" },
          ],
        };
        const ROOM_LIT = {
          type: "custom:fibbers-room",
          name: "Woonkamer",
          icon: "solar:sofa-2-bold-duotone",
          entities: [
            "light.tv_led_strip",
            "light.kitchen",
            "light.woonkamer_computer",
          ],
          sheet: "demo-sheet",
        };
        const ROOM_OFFLINE = {
          type: "custom:fibbers-room",
          name: "Slaapkamer",
          icon: "solar:bed-bold-duotone",
          entities: ["light.hue_go_1", "light.hue_lightstrip_plus_1"],
          sheet: "slaapkamer",
        };

        const ALERT_CONFIG = {
          type: "custom:fibbers-alert",
          checks: [
            { type: "unavailable_lights" },
            { type: "low_battery", below: 20 },
            { type: "updates" },
          ],
        };
        const CHIPS_CONFIG = {
          type: "custom:fibbers-chips",
          chips: [
            {
              name: "Wekker",
              icon: "solar:alarm-bold-duotone",
              action: {
                action: "toggle",
                entity: "input_boolean.wake_alarm_enabled",
              },
              active_when: {
                entity: "input_boolean.wake_alarm_enabled",
                state: "on",
              },
            },
            {
              name: "Alles uit",
              icon: "solar:power-bold-duotone",
              action: {
                action: "call-service",
                service: "light.turn_off",
                target: { entity_id: "light.all_color_lights" },
              },
            },
            {
              name: "Muziek",
              icon: "solar:music-note-bold-duotone",
              action: {
                action: "navigate",
                navigation_path: "/dashboard-thuis/muziek",
              },
            },
          ],
        };
        const SCENE_CONFIG = {
          type: "custom:fibbers-scene",
          scenes: [
            {
              name: "Avond",
              icon: "solar:moon-bold-duotone",
              scene: "scene.avond",
            },
            {
              name: "Helder",
              icon: "solar:sun-bold-duotone",
              scene: "scene.helder",
            },
            {
              name: "Film",
              icon: "solar:clapperboard-play-bold-duotone",
              scene: "scene.film",
            },
          ],
        };

        const SPECIMENS = [
          { tag: "fibbers-section", config: SECTION_CONFIG },
          { tag: "fibbers-alert", config: ALERT_CONFIG },
          { tag: "fibbers-chips", config: CHIPS_CONFIG },
          { tag: "fibbers-scene", config: SCENE_CONFIG },
          { tag: "fibbers-room", config: ROOM_LIT },
          { tag: "fibbers-room", config: ROOM_OFFLINE },
          {
            tag: "fibbers-light-row",
            config: {
              type: "custom:fibbers-light-row",
              entity: "light.tv_led_strip",
              // tapping the icon box toggles the whole group (not just this light)
              icon_entity: "light.all_color_lights",
            },
          },
          { tag: "fibbers-nav", config: NAV_CONFIG },
          { tag: "fibbers-back", config: BACK_CONFIG },
          { tag: "fibbers-sheet", config: SHEET_CONFIG },
        ];

        // Seed a plausible nav stack so fibbers-back shows "Terug naar Huis"
        // instead of the bare fallback. Done before the cards are built so
        // their first _label() reads it.
        window.FIBBERS.nav.stack = [
          "/dashboard-thuis/huis",
          "/dashboard-thuis/licht",
        ];

        const instances = []; // every card element, for re-applying hass on toggle

        function makeCard(spec) {
          const el = document.createElement(spec.tag);
          el.setConfig(JSON.parse(JSON.stringify(spec.config)));
          el.hass = buildHass();
          instances.push(el);
          return el;
        }

        function renderStage() {
          const stage = document.getElementById("stage");

          // phone column
          const phoneCol = document.createElement("div");
          const phoneTitle = document.createElement("p");
          phoneTitle.className = "col-title";
          phoneTitle.textContent = "phone · 390px";
          const phone = document.createElement("div");
          phone.className = "phone";
          SPECIMENS.forEach((spec) => {
            const wrap = document.createElement("div");
            wrap.className = "specimen";
            const cap = document.createElement("p");
            cap.className = "cap";
            cap.textContent = spec.tag;
            wrap.append(cap, makeCard(spec));
            phone.appendChild(wrap);
          });
          phoneCol.append(phoneTitle, phone);

          // desktop column
          const deskCol = document.createElement("div");
          deskCol.className = "desktop";
          const deskTitle = document.createElement("p");
          deskTitle.className = "col-title";
          deskTitle.textContent = "desktop · 1200px";
          const grid = document.createElement("div");
          grid.className = "grid";
          SPECIMENS.forEach((spec) => {
            const wrap = document.createElement("div");
            wrap.className = "specimen";
            const cap = document.createElement("p");
            cap.className = "cap";
            cap.textContent = spec.tag;
            wrap.append(cap, makeCard(spec));
            grid.appendChild(wrap);
          });
          deskCol.append(deskTitle, grid);

          stage.append(phoneCol, deskCol);
        }

        function reapplyHass() {
          const h = buildHass();
          instances.forEach((el) => {
            el.hass = h;
          });
        }

        // --- toggle UI ---
        const TOGGLES = [
          { key: "tvLed", label: "TV LED aan" },
          { key: "hueGo", label: "Hue Go bereikbaar" },
          { key: "battLow", label: "Batterij laag" },
          { key: "update", label: "Update beschikbaar" },
        ];
        function renderControls() {
          const bar = document.getElementById("controls");
          TOGGLES.forEach((t) => {
            const label = document.createElement("label");
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = flags[t.key];
            cb.addEventListener("change", () => {
              flags[t.key] = cb.checked;
              reapplyHass();
            });
            const span = document.createElement("span");
            span.textContent = t.label;
            label.append(cb, span);
            bar.appendChild(label);
          });
          // opener for the demo sheet (the sheet card is invisible in the view)
          const open = document.createElement("button");
          open.textContent = "Open sheet ▸";
          open.style.cssText =
            "font:11px ui-monospace,Menlo,monospace;background:var(--fib-accent);color:#111516;" +
            "border:0;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600";
          open.addEventListener("click", () => {
            window.location.hash = "demo-sheet";
          });
          bar.appendChild(open);
        }

        renderControls();
        renderStage();
      })();
    </script>

    <!--
      SCRIPTED LOGIC TESTS — behavioural, not positional (positional lives in
      fixture.html). Auto-runs when the URL carries ?test=1, or via the button.
      Each test snapshots and restores global state (location, nav.stack, the
      gallery's nav cards) so the page is left clean afterward. Results are put
      on window.__TESTS__ and rendered into a panel.
    -->
    <script>
      (function () {
        const F = window.FIBBERS;
        const results = [];
        const rec = (name, pass, detail) =>
          results.push({ name, pass, detail });
        const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

        const TAB_A = "/dashboard-thuis/huis";
        const TAB_B = "/dashboard-thuis/licht";
        const PAGE_X = "/dashboard-thuis/keuken";
        const PAGE_Y = "/dashboard-thuis/systeem";

        // 1) stack transitions: A -> X -> Y -> back -> back -> tab B => [B],
        //    with previous() correct at every step.
        function testStack() {
          F.navigate(TAB_A);
          const s1 = eq(F.nav.stack, [TAB_A]) && F.previous() === null;
          F.navigate(PAGE_X);
          const s2 = eq(F.nav.stack, [TAB_A, PAGE_X]) && F.previous() === TAB_A;
          F.navigate(PAGE_Y);
          const s3 =
            eq(F.nav.stack, [TAB_A, PAGE_X, PAGE_Y]) && F.previous() === PAGE_X;
          F.goBack();
          const s4 = eq(F.nav.stack, [TAB_A, PAGE_X]) && F.previous() === TAB_A;
          F.goBack();
          const s5 = eq(F.nav.stack, [TAB_A]) && F.previous() === null;
          F.navigate(TAB_B);
          const s6 = eq(F.nav.stack, [TAB_B]) && F.previous() === null;
          const pass = s1 && s2 && s3 && s4 && s5 && s6;
          rec(
            "stack A→X→Y→back→back→tabB ends [tabB], previous() correct each step",
            pass,
            `steps ${[s1, s2, s3, s4, s5, s6].map((b) => (b ? 1 : 0)).join("")}; final=${JSON.stringify(F.nav.stack)}`,
          );
        }

        // 2) 20 rapid tab switches => exactly one bar on body.
        function testNoDuplicates() {
          const tabs = [
            TAB_A,
            TAB_B,
            "/dashboard-thuis/muziek",
            "/dashboard-thuis/tv",
          ];
          for (let i = 0; i < 20; i++) F.navigate(tabs[i % tabs.length]);
          const count = document.querySelectorAll("#fibbers-nav").length;
          rec(
            "no duplicate bars after 20 rapid tab switches",
            count === 1,
            `#fibbers-nav count = ${count}`,
          );
        }

        // 3) detach() removes the bar when the last nav card unmounts.
        function testDetach() {
          const cards = [...document.querySelectorAll("fibbers-nav")];
          const anchors = cards.map((c) => ({
            c,
            parent: c.parentNode,
            next: c.nextSibling,
          }));
          anchors.forEach(({ c }) => c.remove()); // triggers disconnectedCallback -> detach
          const gone = document.getElementById("fibbers-nav") === null;
          rec(
            "detach() removes the bar when the last card unmounts",
            gone,
            `bar present after unmount = ${!gone}`,
          );
          // restore the gallery
          anchors.forEach(({ c, parent, next }) =>
            parent.insertBefore(c, next),
          );
          F.navigate(TAB_A);
        }

        // 4) offset_bottom lifts the bar host and grows the spacer.
        function testOffset() {
          const OFF = 50;
          const card = document.createElement("fibbers-nav");
          card.setConfig({
            type: "custom:fibbers-nav",
            tabs: [
              { name: "X", icon: "solar:home-2-bold-duotone", path: TAB_A },
            ],
            offset_bottom: OFF,
          });
          document.body.appendChild(card); // connect -> attach with offset
          const hostBottom = F.bar.host && F.bar.host.style.bottom;
          const spacerH = parseInt(card.querySelector("div").style.height, 10);
          const expected = Math.round((F.bar.height || 74) + OFF);
          const pass =
            hostBottom === OFF + "px" && Math.abs(spacerH - expected) <= 1;
          rec(
            "offset_bottom lifts host & grows spacer",
            pass,
            `host.bottom=${hostBottom}, spacer=${spacerH}px (expected≈${expected})`,
          );
          card.remove(); // detach this owner; gallery cards remain
        }

        function run() {
          const snapPath = location.pathname + location.search;
          const snapStack = F.nav.stack.slice();
          results.length = 0;
          try {
            testStack();
            testNoDuplicates();
            testDetach();
            testOffset();
          } finally {
            // restore: clear the offset the last attach may have left, reset stack & URL
            if (F.bar.host) F.bar.host.style.bottom = "";
            F.nav.stack = snapStack;
            history.replaceState(null, "", snapPath);
            window.dispatchEvent(
              new CustomEvent("location-changed", {
                detail: { replace: true },
              }),
            );
          }
          const allPass = results.every((r) => r.pass);
          window.__TESTS__ = { allPass, results };
          paint(allPass);
          return window.__TESTS__;
        }

        function paint(allPass) {
          let el = document.getElementById("testpanel");
          if (!el) {
            el = document.createElement("aside");
            el.id = "testpanel";
            el.style.cssText =
              "position:fixed;left:12px;bottom:92px;width:360px;max-height:46vh;overflow:auto;" +
              "background:rgba(20,26,27,.96);border:1px solid #333e41;border-radius:10px;padding:10px 12px;" +
              "font:11px/1.5 ui-monospace,Menlo,monospace;color:#a9b6b9;z-index:5";
            document.body.appendChild(el);
          }
          el.innerHTML =
            `<b style="color:${allPass ? "#63c295" : "#ec8377"}">SCRIPTED TESTS: ${allPass ? "ALL PASS" : "FAIL"}</b><br>` +
            window.__TESTS__.results
              .map(
                (r) =>
                  `<div style="margin-top:5px"><span style="color:${r.pass ? "#63c295" : "#ec8377"}">${r.pass ? "✓" : "✗"}</span> ${r.name}<br><span style="color:#7d8b8e">${r.detail}</span></div>`,
              )
              .join("");
        }

        window.__runTests = run;

        // control button
        const btn = document.createElement("button");
        btn.textContent = "Run scripted tests";
        btn.style.cssText =
          "position:fixed;left:12px;bottom:52px;z-index:6;background:#1d2426;color:#edf1f1;" +
          "border:1px solid #333e41;border-radius:8px;padding:6px 10px;font:11px ui-monospace,Menlo,monospace;cursor:pointer";
        btn.addEventListener("click", run);
        document.body.appendChild(btn);

        if (/[?&]test=1\b/.test(location.search)) {
          // let the gallery settle first
          requestAnimationFrame(() => requestAnimationFrame(run));
        }
      })();
    </script>
  </body>
</html>
